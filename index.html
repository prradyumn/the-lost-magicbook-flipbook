<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Little Storybook</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,700;0,800;0,900;1,700&family=Fredoka+One&family=Lobster&display=swap"
      rel="stylesheet"
    />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./game.css" />
        <!-- 3D model renderer for the GLB cube in the tutorial game -->
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader">
      <div class="loader-stage">
        <div class="loader-book">
          <img class="loader-cover-img" src="cover.png" alt="The Lost Magic Book" />
        </div>
        <div class="loader-overlay">
          <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
          <!-- Shape parade: cone, sphere, cylinder, cube bounce on a wave;
               each lights up when the bar crosses its threshold (25/50/75/100%). -->
          <div class="loader-shape-parade" id="loaderShapes">
            <svg class="ls-shape" data-threshold="25" viewBox="0 0 100 100" aria-hidden="true">
              <polygon points="50,12 88,84 12,84" />
            </svg>
            <svg class="ls-shape" data-threshold="50" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="36" />
            </svg>
            <svg class="ls-shape" data-threshold="75" viewBox="0 0 100 100" aria-hidden="true">
              <ellipse cx="50" cy="20" rx="30" ry="8" />
              <rect x="20" y="20" width="60" height="60" />
              <ellipse cx="50" cy="80" rx="30" ry="8" />
            </svg>
            <svg class="ls-shape" data-threshold="100" viewBox="0 0 100 100" aria-hidden="true">
              <rect x="18" y="18" width="64" height="64" rx="4" />
            </svg>
          </div>
          <button
            id="startBtn"
            class="cover-start-btn"
            type="button"
            style="display:none;"
            onclick="startApp()"
          >
            Start
          </button>
        </div>
      </div>
    </div>

    <!-- Themed background decorations (filled by applyTheme) -->
    <svg
      id="themeDecor"
      style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0"
      viewBox="0 0 1000 600"
      preserveAspectRatio="none"
    ></svg>

    <button id="replayBtn" type="button" onclick="replayPage()"><span class="replay-icon" aria-hidden="true">&#8635;</span><span>Replay</span></button>
    <audio id="bgMusic" loop preload="auto"></audio>

    <div class="book-scene">
      <div class="book-cover-wrap">
        <div class="flipbook-viewport" style="position:relative">
          <div class="container">
            <div id="flipbook" dir="ltr"><!-- pages injected by JS --></div>
          </div>
          <!-- Overlay: text & bubbles sit above ALL turn.js pages, no clipping -->
          <div id="storyOverlay"></div>
          <!-- Book spine gutter â€” on top of everything -->
          <div class="book-spine"></div>
        </div>
      </div>
      <div class="pg-cnt" id="pgCnt">My Storybook</div>
    </div>




    <!-- Pre-game intro screen — shown right before the shape tutorials.
         Background is the LBD SCREEN.png art; the "Let's Go" button is
         pure CSS (no image) so it scales crisply and pulses. -->
    <div id="lbdOverlay">
      <button class="lbd-go-btn" id="lbdGoBtn" type="button">
        <span class="lbd-go-btn-label">Let&rsquo;s Go</span>
      </button>
    </div>

    <!-- 1st Cube tutorial game overlay (shown between page 4 and page 5) -->
    <div id="gameOverlay">
      <div class="game-stage" id="gameStage"></div>
    </div>

    <!-- ===== DEV ONLY =================================================
         Quick jump to the sorting game, bypassing the flipbook + tutorials.
         REMOVE THIS BUTTON, ITS CSS BLOCK (#devJumpToGame in style.css),
         AND THE CLICK HANDLER (script.js, search "devJumpToGame")
         BEFORE PRODUCTION.
         ============================================================== -->
    <button id="devJumpToGame" type="button" title="Dev: skip to sorting game">
      &#9654; Game
    </button>


    <script src="./script.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
